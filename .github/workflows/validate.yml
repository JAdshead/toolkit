name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md frontmatter
        run: bin/validate-skills

      - name: Check shared reference copies
        run: bin/sync-shared --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the Claude Code plugin and marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: Check shell scripts
        run: shellcheck install.sh bin/toolkit bin/validate-skills bin/sync-shared shared/board shared/test/* hooks/session-start test/*.sh

      - name: Test shared scripts
        run: shared/test/board_test.sh

      - name: Test toolkit init, the TDD rules and the SessionStart hook
        run: |
          test/init_test.sh
          test/tdd_test.sh
          test/session_start_test.sh

      - name: Test bin/sync-shared
        run: test/sync_shared_test.sh

      - name: Test agent-coach usage digest
        run: python3 test/usage_digest_test.py
