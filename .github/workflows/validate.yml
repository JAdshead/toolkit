name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md frontmatter
        run: bin/validate-skills

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the Claude Code plugin and marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: Check shell scripts
        run: shellcheck install.sh bin/toolkit bin/validate-skills
