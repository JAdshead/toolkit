name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md frontmatter
        run: bin/validate-skills

      - name: Check shared reference copies
        run: bin/sync-shared --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the Claude Code plugin and marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: Check shell scripts
        run: shellcheck install.sh bin/toolkit bin/validate-skills bin/sync-shared shared/board shared/pr-media shared/run-watched shared/test/* hooks/session-start test/*.sh

      - name: Test shared scripts
        run: |
          shared/test/board_test.sh
          shared/test/pr_media_test.sh
          shared/test/run_watched_test.sh

      - name: Install Playwright for pr-media capture
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright
          (cd "$RUNNER_TEMP/pw" && npx playwright install --with-deps chromium)

      - name: Test pr-media capture
        run: PLAYWRIGHT_PROJECT="$RUNNER_TEMP/pw" shared/test/pr_media_capture_test.sh

      - name: Test toolkit init, the TDD and UI rules, ux-goal, refine-issues, the shared lenses and the SessionStart hook
        run: |
          test/init_test.sh
          test/tdd_test.sh
          test/ui_design_test.sh
          test/ux_goal_test.sh
          test/visual_plan_test.sh
          test/refine_issues_test.sh
          test/session_start_test.sh
          test/review_loop_test.sh
          test/review_cost_test.sh
          test/ci_status_test.sh
          test/pr_media_wiring_test.sh
          test/batch_flow_test.sh
          test/shared_lenses_test.sh

      - name: Test bin/sync-shared
        run: test/sync_shared_test.sh

      - name: Test agent-coach usage digest
        run: python3 test/usage_digest_test.py
